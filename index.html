<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Jimmy厨房"><title>Jimmy’s Kitchen</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><button class="circle" aria-label="菜单">☰</button><div class="brand"><b>Jimmy’s Kitchen</b><span>老婆想吃什么呢？ ❤️</span></div><button id="favOnly" class="favTop">❤️ 收藏</button></header>
<main><section class="random"><div><small>不知道吃什么？</small><strong>帮你随机搭配三道菜</strong></div><button id="randomBtn">🎲 随便选</button></section><nav id="categories" class="categories"></nav><div class="addDishStrip"><button id="openAddDish" class="addDishBtn">＋ 没找到？新增一道菜</button></div><section class="menuSec"><div class="heading"><h2 id="menuTitle">全部菜品</h2><span id="count"></span></div><div id="menuGrid" class="grid"></div></section><section id="riceSection" class="rice"><div class="heading"><h2>米饭 · 几碗</h2><span class="required">必选</span></div><div class="riceCard"><img src="images/rice_bowl.jpg" alt="白米饭"><div class="riceCardBody"><strong>白米饭</strong><small>请选择碗数；即使不要米饭也必须选择。</small><div id="riceOptions" class="riceOptions"></div></div></div><p id="riceError" class="error hidden">请选择米饭数量。</p></section></main>
<button id="cartBar" class="cartBar"><div><b>🛒 <span id="cartCount">0</span> 项</b><small id="cartHint">购物车是空的</small></div><span>查看购物车 ›</span></button><div id="overlay" class="overlay hidden"></div><aside id="cartDrawer" class="drawer"><div class="grab"></div><div class="drawerHead"><h2>今晚的订单</h2><button id="closeCart" class="circle">✕</button></div><div id="cartItems"></div><div class="riceSum"><span>米饭</span><b id="riceSummary">未选择</b></div><label>希望几点吃？<input id="mealTime" type="time"></label><label>备注<textarea id="notes" rows="4" placeholder="例如：少辣、不要葱、鸡翅煎焦一点"></textarea></label><button id="shareOrder" class="primary">发送订单给老公</button><button id="copyOrder" class="secondary">复制订单文字</button></aside><div id="toast" class="toast hidden"></div>
<aside id="addDishSheet" class="addDishSheet" aria-hidden="true">
  <div class="grab"></div>
  <div class="addDishHead"><div><small>NEW DISH</small><h2>新增一道菜</h2></div><button id="closeAddDish" class="circle">✕</button></div>
  <label>菜名 *<input id="customDishName" type="text" maxlength="30" placeholder="例如：糖醋里脊"></label>
  <label>分类<select id="customDishCategory"><option>肉类</option><option>蔬菜</option><option>家常菜</option><option>海鲜</option><option>汤</option><option>主食</option><option>凉菜</option><option>饮品</option><option>特别料理</option><option>自定义</option></select></label>
  <label>菜品图片（可选）<input id="customDishPhoto" type="file" accept="image/*"></label>
  <div id="customPhotoPreview" class="photoPreview">可以直接从 iPhone 相册选择一张照片<br>不选也可以保存</div>
  <div class="addDishActions"><button id="cancelAddDish" class="secondary">取消</button><button id="saveCustomDish" class="primary">保存并加入菜单</button></div>
</aside>

<iframe id="orderSubmitFrame" name="orderSubmitFrame" class="orderSubmitFrame" title="Order submission"></iframe>
<div id="orderConfirmOverlay" class="confirmOverlay hidden">
  <section class="confirmCard" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirmIcon">✓</div>
    <h2 id="confirmTitle">Your order has been confirmed!</h2>
    <p>订单已确认 ❤️</p>
    <small>订单已经发到老公邮箱啦～ ❤️</small>
    <button id="closeOrderConfirm" class="confirmButton">好 ❤️</button>
  </section>
</div>
<script src="menu.js"></script><script src="app.js"></script></body></html>
