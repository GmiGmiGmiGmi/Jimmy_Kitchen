<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Jimmy厨房"><title>Jimmy’s Kitchen</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<header class="top"><button class="circle" aria-label="菜单">☰</button><div class="brand"><b>Jimmy’s Kitchen</b><span>老婆想吃什么呢？ ❤️</span></div><button id="favOnly" class="favTop">❤️ 收藏</button></header>
<main><section class="random"><div><small>不知道吃什么？</small><strong>帮你随机搭配三道菜</strong></div><button id="randomBtn">🎲 随便选</button></section><nav id="categories" class="categories"></nav><section class="menuSec"><div class="heading"><h2 id="menuTitle">全部菜品</h2><span id="count"></span></div><div id="menuGrid" class="grid"></div></section><section id="riceSection" class="rice"><div class="heading"><h2>🍚 米饭 · 几碗</h2><span class="required">必选</span></div><div id="riceOptions" class="riceOptions"></div><p id="riceError" class="error hidden">请选择米饭数量。</p></section></main>
<button id="cartBar" class="cartBar"><div><b>🛒 <span id="cartCount">0</span> 项</b><small id="cartHint">购物车是空的</small></div><span>查看购物车 ›</span></button><div id="overlay" class="overlay hidden"></div><aside id="cartDrawer" class="drawer"><div class="grab"></div><div class="drawerHead"><h2>今晚的订单</h2><button id="closeCart" class="circle">✕</button></div><div id="cartItems"></div><div class="riceSum"><span>米饭</span><b id="riceSummary">未选择</b></div><label>希望几点吃？<input id="mealTime" type="time"></label><label>备注<textarea id="notes" rows="4" placeholder="例如：少辣、不要葱、鸡翅煎焦一点"></textarea></label><button id="shareOrder" class="primary">发送订单给老公</button><button id="copyOrder" class="secondary">复制订单文字</button></aside><div id="toast" class="toast hidden"></div><script src="menu.js"></script><script src="app.js"></script></body></html>
